<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfd9ec"><meta name="description" content="구름 아래 굽이치는 화강암 들판에서 작은 검정색 8을 굴리는 Studio 82.">
<title>Studio 82</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='10' y='56' font-family='Arial' font-weight='900' font-size='64' fill='%23141414'%3E8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="world" aria-label="Studio 82 화강암 들판">
<canvas id="scene" tabindex="0" aria-label="방향키나 WASD로 이동합니다. 스페이스바는 점프, Shift는 이륙과 착륙입니다. 비행 중 위아래 키로 상승과 하강, 좌우 키로 선회합니다."></canvas>
<header>
  <h1 class="identity"><button type="button" id="home-title" title="처음 위치로" aria-label="Studio 82, 처음 위치로">Studio 82</button></h1>
  <div class="toolbar">
    <button id="audio" title="돌소리 켜기" aria-label="돌소리 켜기" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="mute" d="m17 10 4 4m0-4-4 4"/><g class="waves"><path d="M16 8.5a5 5 0 0 1 0 7m2.5-9.5a8.5 8.5 0 0 1 0 12"/></g></svg></button>
    <button id="full" title="전체 화면" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg></button>
  </div>
</header>
<div id="status" role="status">들판 불러오는 중…</div>
<footer>
  <div class="controls">
  <div class="desktop-guide">
    <span class="movement-keys" aria-hidden="true"><kbd class="up">↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><span id="steer-hint">이동</span>
    <i></i>
    <svg class="mouse" viewBox="0 0 22 26" aria-hidden="true"><rect x="4.5" y="2.5" width="13" height="20" rx="6.5"/><path d="M11 6v4"/></svg><span>드래그로 시점 회전</span>
  </div>
  <div class="touch-guide" aria-label="이동 키">
    <button data-key="ArrowUp" aria-label="앞으로">↑</button><button data-key="ArrowLeft" aria-label="왼쪽으로">←</button><button data-key="ArrowDown" aria-label="뒤로">↓</button><button data-key="ArrowRight" aria-label="오른쪽으로">→</button>
  </div>
  <div class="actions">
    <button id="jump" type="button" aria-keyshortcuts="Space"><kbd>Space</kbd> 점프</button>
    <button id="flight" type="button" aria-keyshortcuts="Shift F"><kbd>Shift</kbd> <span id="flight-label">이륙</span></button>
  </div>
  </div>
  <span id="travel-status" class="sr-only" role="status"></span>
  <div class="dock">
    <div id="atlas" class="atlas">
      <div id="atlas-panel" class="atlas-panel" aria-hidden="true">
        <svg id="atlas-svg" class="atlas-map" viewBox="0 0 216 216" aria-hidden="true"></svg>
        <button type="button" id="atlas-pin" aria-pressed="false" aria-label="지도 고정" title="지도 고정 (M)"><svg viewBox="0 0 24 24"><circle class="pin-dot" cx="12" cy="12" r="3.1"/><path d="M12 4.5v3M12 16.5V19.5M4.5 12h3M16.5 12H19.5"/></svg></button>
        <p class="sr-only">전시 공간은 8자 섬입니다. 지도는 같은 윤곽의 등고선이고 작품 번호가 표시됩니다. 호수 물속에도 들어갈 수 있고, 북쪽 호수에서는 투명한 물고기들이 떠다닙니다. 한 마리씩 다가와 잠시 무늬를 남긴 뒤 떠납니다. 절벽 밖으로 나가면 다시 돌아옵니다. 지도의 위쪽은 북쪽입니다.</p>
      </div>
      <button type="button" id="atlas-open" aria-expanded="false" aria-controls="atlas-panel" aria-label="지도 열기" title="지도 열기 (M)"><svg viewBox="0 0 24 24"><path d="M4 7.5 9 5.5l6 2 5-2v11l-5 2-6-2-5 2z"/><path d="M9 5.5v11M15 7.5v11"/></svg></button>
    </div>
    <div class="position"><div class="coordinates" aria-label="현재 위치"><span>X <b id="posx">0.0</b></span><span>Z <b id="posz">0.0</b></span></div>
      <button id="home" title="처음 위치로" aria-label="처음 위치로"><svg viewBox="0 0 24 24"><path d="M5 10a7 7 0 1 1 .6 5M5 5v5h5"/></svg></button>
    </div>
  </div>
</footer>
<div id="veil" hidden aria-hidden="true"><div class="mist"></div><div class="fill"></div></div>
</main>
<script src="vendor/three.js"></script>
<script src="js/previews/catalog.js"></script>
<script src="js/previews/cache.js"></script>
<script src="js/previews/loader.js"></script>
<script src="js/previews/stage.js"></script>
<script src="js/ending-lake.js"></script>
<script src="js/exhibition.js"></script>
<script src="js/main.js"></script>
</body>
</html>
